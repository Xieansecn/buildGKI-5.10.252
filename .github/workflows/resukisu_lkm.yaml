# =====================================================================
#  marble kernel builder with built-in root manager — PixelOS-compatible
#  (Poco F5 / Redmi Note 12 Turbo)
#
#  Goal: rebuild the ROM's kernel (same source recipe + same config) with a
#  NEW root manager compiled in, so the stock vendor_dlkm keeps loading
#  (identical version string + identical symbol CRCs) while the kernel gains
#  a fresh KernelSU / KernelSU-Next / ReSukiSU.
#
#  Kernel source recipe (ROM author, Telegram 2026-06):
#    - Kernel : LineageOS/android_kernel_xiaomi_sm8450 @ lineage-23.2,
#               pinned to 38c6baf4bb72 (SUBLEVEL 252, vendor tree)
#    - Device tree : aosp-pablo/android_kernel_xiaomi_sm8450-devicetrees @ 16
#                    (HEAD == cea1f9d "Fix goodix fingerprint supply name")
#    - Patch  : patches/0001-kk.patch (adds goodix_3626 fingerprint driver)
#    - Config : configs/pixelos_kernel.config = .config extracted from the
#               running ROM (device-config mode) — keeps symbol CRCs identical
#    - Version: localversion input forces the exact kernel version suffix
#               (e.g. -gki-gf3f02401fb28) so vermagic matches vendor_dlkm
#
#  The ROM's own kernel already ships an (old) built-in KernelSU-Next+SUSFS;
#  its CONFIG_KSU* entries are stripped from the config and replaced by the
#  selected manager (default: official tiann/KernelSU, works with the
#  official KernelSU Manager).
#
#  Outputs (artifacts):
#    - Image               : kernel with the root manager compiled in
#    - goodix_3626.ko      : fingerprint driver module (from the kk patch)
#    - build.log
# =====================================================================
name: build marble kernel (built-in KernelSU/KernelSU-Next/ReSukiSU)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel source preset'
        type: choice
        default: 'lineage-23.2'
        options:
          - 'lineage-23.2'    # LineageOS lineage-23.2 pinned to 38c6baf4bb72 (SUBLEVEL 252, vendor tree) + patches/0001-kk.patch
          - 'aosp-pablo-16'   # aosp-pablo fork branch 16 (goodix_3626 already merged)
      kernel_ref:
        description: 'Kernel commit to pin — use the FULL 40-char SHA (abbreviated SHAs fail: "couldn''t find remote ref"). Default: 38c6baf4bb72f783bb3588f9f1240603632a6c83 = lineage-23.2 device-branch merge (2026-03-20), SUBLEVEL 252 + vendor tree (NOT b8f0c806, that is the pure-GKI branch without vendor files). Leave blank for branch head.'
        type: string
        default: '38c6baf4bb72f783bb3588f9f1240603632a6c83'
      localversion:
        description: 'Exact version suffix override, e.g. -gki-gf3f02401fb28 (or with -dirty). Set to the ROM kernel string seen in /proc/version AFTER 5.10.252 so vermagic matches exactly. REQUIRED in device-config mode for vendor modules to load. Leave blank for auto git hash.'
        type: string
        default: ''
      config_source:
        description: 'Kernel config base. device-config (recommended for PixelOS): use configs/pixelos_kernel.config (config extracted from your running ROM) so symbol CRCs match the ROM vendor_dlkm. fragments: gki_defconfig + waipio/xiaomi/marble/debugfs fragments.'
        type: choice
        default: 'device-config'
        options:
          - 'device-config'
          - 'fragments'
      devicetrees:
        description: 'Device tree source (branch 16 contains goodix fp supply fix cea1f9d)'
        type: choice
        default: 'aosp-pablo-16'
        options:
          - 'aosp-pablo-16'
      toolchain:
        description: 'Toolchain (llvm-22.1.8 = aosp-pablo proven combo)'
        type: choice
        default: 'llvm-22.1.8'
        options:
          - 'llvm-22.1.8'     # upstream LLVM release, no ncurses5 needed
          - 'android-clang'   # official Android prebuilt clang-r547379
      lto:
        description: 'LTO mode (thin recommended on free runners)'
        type: choice
        default: 'thin'
        options:
          - 'none'
          - 'thin'
          - 'full'
      manager:
        description: 'Root manager built INTO the kernel (CONFIG_KSU=y). kernelsu = official tiann/KernelSU (works with official KernelSU Manager; no SUSFS). kernelsu-next = rifsxd/KernelSU-Next (needs KernelSU-Next Manager). resukisu = ReSukiSU (multi-manager + built-in SUSFS).'
        type: choice
        default: 'kernelsu'
        options:
          - 'kernelsu'
          - 'kernelsu-next'
          - 'resukisu'
      enable_susfs:
        description: 'Enable SUSFS (kernelsu-next via external Simonpunk patch, resukisu built-in; ignored for official kernelsu)'
        type: boolean
        default: false

concurrency:
  group: resukisu-lkm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_DIR: kernel_workspace
      OUT_DIR: out
      RELEASE_DIR: release
      JOBS: '2'
      ARCH: arm64
      # aosp-pablo KernelSU-Next-marble proven pin (config/marble.env)
      LLVM_22_1_8_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz
      LLVM_22_1_8_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      # Android prebuilt clang (fallback preset)
      CLANG_VER: clang-r547379

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

      - name: Setup swap (needed for LTO)
        if: ${{ inputs.lto != 'none' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Install dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            bc bison build-essential cpio curl flex git kmod
            libelf-dev libncurses-dev libssl-dev file pahole
            python3 python-is-python3 rsync unzip zip zstd xz-utils
          version: 1.0

      - name: Install legacy ncurses5 (Android prebuilt clang only)
        if: ${{ inputs.toolchain == 'android-clang' }}
        run: |
          # Android's prebuilt clang.real links libncurses.so.5, missing on
          # Ubuntu 24.04. Grab the jammy debs from the archive.
          cd /tmp
          wget -q https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.2_amd64.deb
          wget -q https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.2_amd64.deb
          test -f libtinfo5_*.deb && test -f libncurses5_*.deb || {
            echo "::error::failed to download ncurses5 debs"; exit 1; }
          sudo dpkg -i libtinfo5_*.deb libncurses5_*.deb
          sudo apt-get install -f -y

      - name: Setup toolchain
        run: |
          if [ "${{ inputs.toolchain }}" == "llvm-22.1.8" ]; then
            curl -fL --retry 3 -o /tmp/llvm.tar.xz "${LLVM_22_1_8_URL}"
            echo "${LLVM_22_1_8_SHA256}  /tmp/llvm.tar.xz" | sha256sum -c -
            mkdir -p llvm
            tar -xJf /tmp/llvm.tar.xz -C llvm
            # realpath: later steps run from kernel_workspace/, so LLVM_BIN must
            # be absolute or clang/ld.lld will not be found.
            LLVM_BIN="$(realpath "$(dirname "$(find llvm -name clang -path '*/bin/*' | head -1)")")"
            test -x "${LLVM_BIN}/clang" && test -x "${LLVM_BIN}/ld.lld" || {
              echo "::error::LLVM 22.1.8 incomplete"; exit 1; }
            echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"
            "${LLVM_BIN}/clang" --version
          else
            # Android official prebuilt clang (complete toolchain incl. ld.lld)
            curl -fL --retry 3 \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VER}.tar.gz" \
              -o /tmp/clang.tar.gz
            mkdir -p clang
            tar -xzf /tmp/clang.tar.gz -C clang
            test -x clang/bin/clang && test -x clang/bin/ld.lld || {
              echo "::error::android clang toolchain incomplete"; exit 1; }
            echo "LLVM_BIN=$(pwd)/clang/bin" >> "${GITHUB_ENV}"
            clang/bin/clang --version
          fi

      - name: Clone kernel source
        run: |
          case "${{ inputs.kernel_source }}" in
            aosp-pablo-16)
              git clone --depth=1 -b 16 \
                https://github.com/aosp-pablo/android_kernel_xiaomi_sm8450 "${KERNEL_DIR}"
              ;;
            *)
              git clone --depth=1 -b lineage-23.2 \
                https://github.com/LineageOS/android_kernel_xiaomi_sm8450 "${KERNEL_DIR}"
              ;;
          esac
          cd "${KERNEL_DIR}"
          # Default pin 38c6baf4bb72 = lineage-23.2 device-branch merge
          # (2026-03-20): SUBLEVEL 252 + full vendor tree (xiaomi_GKI.config,
          # fingerprint drivers, ...). Do NOT use b8f0c806 (android12-5.10.252
          # tag merge): that commit lives on the pure-GKI android12-5.10
          # branch and has no vendor files, so the kk patch cannot apply.
          if [ -n "${{ inputs.kernel_ref }}" ]; then
            git fetch --depth=1 origin "${{ inputs.kernel_ref }}"
            git checkout -q "${{ inputs.kernel_ref }}"
            echo "pinned to: $(git rev-parse --short HEAD)"
          fi
          echo "---- kernel version ----"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

      - name: Apply goodix_3626 fingerprint patch (LineageOS preset only)
        if: ${{ inputs.kernel_source == 'lineage-23.2' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # 0001-kk.patch adds drivers/input/fingerprint/goodix_3626 and
          # CONFIG_FINGERPRINT_GOODIX_3626=m. Commit it so the tree stays clean
          # (a dirty tree would append "-dirty" to the kernel/vermagic string).
          git apply --check ../patches/0001-kk.patch
          git apply ../patches/0001-kk.patch
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -q -m "Apply goodix_3626 fingerprint driver (0001-kk.patch)"
          ls -d drivers/input/fingerprint/goodix_3626

      - name: Checkout device tree (aosp-pablo sm8450-devicetrees @ 16)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # The kernel tree links arch/arm64/boot/dts/vendor ->
          # ../../../../../sm8450-devicetrees, i.e. the devicetrees repo must
          # live as a SIBLING of the kernel source dir (LineageOS convention,
          # same as aosp-pablo's CI). Branch 16 HEAD == cea1f9d (goodix fp
          # supply name fix for marble-sm7475).
          git clone --depth=1 -b 16 \
            https://github.com/aosp-pablo/android_kernel_xiaomi_sm8450-devicetrees ../sm8450-devicetrees
          test -f arch/arm64/boot/dts/vendor/qcom/marble-sm7475.dtsi || {
            echo "::error::marble-sm7475.dtsi not found via vendor symlink"; exit 1; }
          ls arch/arm64/boot/dts/vendor/qcom/marble* 2>/dev/null | head

      - name: Integrate root manager (in-tree, built into Image)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # Each manager's kernel/setup.sh clones the manager source into
          # KernelSU/, symlinks drivers/kernelsu and registers CONFIG_KSU in
          # the kernel Kconfig. The manager is compiled IN (CONFIG_KSU=y).
          case "${{ inputs.manager }}" in
            kernelsu-next)
              setup_url="https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh"
              setup_arg="next"
              ;;
            resukisu)
              setup_url="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"
              setup_arg=""
              ;;
            *)
              setup_url="https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
              setup_arg="main"
              ;;
          esac
          curl -fsSL "${setup_url}" -o /tmp/manager-setup.sh
          if [ -n "${setup_arg}" ]; then
            bash /tmp/manager-setup.sh "${setup_arg}"
          else
            bash /tmp/manager-setup.sh
          fi
          ls -d KernelSU drivers/kernelsu
          # Ignore + commit the integration so the tree is not "-dirty":
          echo "KernelSU/" >> .gitignore
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -q -m "Integrate ${MANAGER} into kernel"
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile | head

      - name: Integrate external SUSFS (KernelSU-Next only; ReSukiSU has built-in SUSFS)
        if: ${{ inputs.enable_susfs == true && inputs.manager == 'kernelsu-next' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clone --depth=1 -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          patch -p1 --fuzz=3 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          rsync -a susfs4ksu/kernel_patches/fs/ fs/
          rsync -a susfs4ksu/kernel_patches/include/ include/
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -q -m "Apply Simonpunk SUSFS patch"

      - name: Warn about SUSFS on official kernelsu (not fatal)
        if: ${{ inputs.enable_susfs == true && inputs.manager == 'kernelsu' }}
        run: |
          echo "::warning::tiann/KernelSU has no SUSFS support; ignoring enable_susfs and continuing."

      - name: Configure kernel (base config + KSU=m)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="${LLVM_BIN}:${PATH}"
          export ARCH=arm64
          mkdir -p "${RELEASE_DIR}"
          if [ "${{ inputs.config_source }}" == "device-config" ]; then
            # Use the config extracted from the running ROM (committed as
            # configs/pixelos_kernel.config): same CONFIG_* values as the ROM
            # kernel -> symbol CRCs match -> vendor_dlkm modules load.
            mkdir -p "${OUT_DIR}"
            cp ../configs/pixelos_kernel.config "${OUT_DIR}/.config"
            # Strip the ROM's built-in (old) KernelSU-Next + SUSFS entries:
            # they belong to the old in-kernel manager and must not linger
            # when we integrate the selected manager below.
            sed -i '/^CONFIG_KSU/d' "${OUT_DIR}/.config"
            echo "using device config: $(grep -cE '^CONFIG_' "${OUT_DIR}/.config") entries (KSU entries stripped)"
          else
            make O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang gki_defconfig
            # Vendor fragments (aosp-pablo KernelSU-Next-marble marble preset)
            ./scripts/kconfig/merge_config.sh -O "${OUT_DIR}" -m "${OUT_DIR}/.config" \
              arch/arm64/configs/vendor/waipio_GKI.config \
              arch/arm64/configs/vendor/xiaomi_GKI.config \
              arch/arm64/configs/vendor/marble_GKI.config \
              arch/arm64/configs/vendor/debugfs.config
          fi
          # Root manager compiled INTO the kernel (built-in, not LKM):
          scripts/config --file "${OUT_DIR}/.config" -e KSU
          if [ "${{ inputs.enable_susfs }}" == "true" ] && \
             { [ "${{ inputs.manager }}" == "kernelsu-next" ] || [ "${{ inputs.manager }}" == "resukisu" ]; }; then
            scripts/config --file "${OUT_DIR}/.config" -e KSU_SUSFS
            scripts/config --file "${OUT_DIR}/.config" \
              -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP
          fi
          # kprobes/kallsyms the manager relies on (GKI has them; be explicit):
          scripts/config --file "${OUT_DIR}/.config" -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -e KALLSYMS
          # goodix_3626 fingerprint driver (added by patches/0001-kk.patch).
          # The device config predates it, so enable it explicitly as module:
          scripts/config --file "${OUT_DIR}/.config" -m FINGERPRINT_GOODIX_3626
          # LTO selection
          case "${{ inputs.lto }}" in
            none) scripts/config --file "${OUT_DIR}/.config" -d LTO_CLANG -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE || true ;;
            thin) scripts/config --file "${OUT_DIR}/.config" -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG -e LTO_CLANG_THIN || true ;;
            full) scripts/config --file "${OUT_DIR}/.config" -d LTO_NONE -d LTO_CLANG_THIN -e LTO_CLANG -e LTO_CLANG_FULL || true ;;
          esac
          # Exact vermagic matching: if the ROM kernel's version suffix is
          # known (from /proc/version), reproduce it exactly by disabling the
          # auto git hash and hard-setting CONFIG_LOCALVERSION.
          if [ -n "${{ inputs.localversion }}" ]; then
            LV="$(echo "${{ inputs.localversion }}" | tr -d '"' | tr -d "'" | tr -d '\`')"
            scripts/config --file "${OUT_DIR}/.config" -d LOCALVERSION_AUTO
            scripts/config --file "${OUT_DIR}/.config" --set-str LOCALVERSION "${LV}"
            echo "::notice::Forced CONFIG_LOCALVERSION=${LV} (LOCALVERSION_AUTO off)"
          fi
          make O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang olddefconfig
          grep -q '^CONFIG_KSU=y$' "${OUT_DIR}/.config" || {
            echo "::error::CONFIG_KSU is not =y after olddefconfig (manager Kconfig not registered?)"; exit 1; }
          echo "---- final config ----"
          grep -E 'CONFIG_KSU|CONFIG_KPROBES|CONFIG_LTO|CONFIG_LOCALVERSION|CONFIG_FINGERPRINT' "${OUT_DIR}/.config" || true

      - name: Build kernel (Image)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # pipefail: without it `make ... | tee` hides a failing make (tee exits 0)
          set -o pipefail
          export PATH="${LLVM_BIN}:${PATH}"
          export ARCH=arm64
          if [ "${{ inputs.lto }}" == "thin" ]; then
            mkdir -p "${OUT_DIR}"
            printf '#!/bin/bash\nexec ld.lld "$@" --thinlto-jobs=2 --thinlto-cache-dir=/tmp/thinlto-cache\n' > "${OUT_DIR}/ld-thinlto-wrapper"
            chmod +x "${OUT_DIR}/ld-thinlto-wrapper"
            export LD="$(pwd)/${OUT_DIR}/ld-thinlto-wrapper"
            export HOSTLD="$(pwd)/${OUT_DIR}/ld-thinlto-wrapper"
          fi
          # Image only (vmlinux + Module.symvers are produced alongside).
          # modules_prepare generates scripts/module.lds, which external
          # module (M=) builds need to link the final .ko.
          # The `dtbs` target is intentionally NOT built: the aosp-pablo
          # devicetrees repo includes <bindings/qcom,audio-ext-clk.h> whose
          # headers live at include/dt-bindings/clock/... in this kernel tree
          # (path layout mismatch), so the audio .dtbo build always fails.
          # This is harmless: GKI flashing keeps the STOCK vendor_boot DTB
          # untouched anyway, and the ReSukiSU LKM does not need dtbs.
          make -j"${JOBS}" O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            KBUILD_BUILD_USER=marble KBUILD_BUILD_HOST=github-actions \
            Image modules_prepare 2>&1 | tee "${RELEASE_DIR}/build.log"

      - name: Build fingerprint module (goodix_3626)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -o pipefail
          export PATH="${LLVM_BIN}:${PATH}"
          export ARCH=arm64
          if [ "${{ inputs.lto }}" == "thin" ]; then
            export LD="$(pwd)/${OUT_DIR}/ld-thinlto-wrapper"
            export HOSTLD="$(pwd)/${OUT_DIR}/ld-thinlto-wrapper"
          fi
          # In-tree subdir build: compiles CONFIG_FINGERPRINT_GOODIX_3626=m
          # (driver added by patches/0001-kk.patch) -> out/drivers/input/
          # fingerprint/goodix_3626/goodix_3626.ko
          make -j"${JOBS}" O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            drivers/input/fingerprint/goodix_3626/ 2>&1 | tee -a "${RELEASE_DIR}/build.log"
          find "${OUT_DIR}" -name 'goodix_3626.ko' 2>/dev/null

      - name: Verify and collect artifacts
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMG="${OUT_DIR}/arch/arm64/boot/Image"
          test -s "${IMG}" || { echo "::error::Image not built"; exit 1; }
          echo "==== kernel release (must equal device /proc/version: 5.10.252-gki-gf3f02401fb28) ===="
          cat "${OUT_DIR}/include/config/kernel.release"
          echo "==== root manager embedded in Image ===="
          strings "${IMG}" | grep -iE -m3 'kernelsu|resukisu|KSU_VERSION' || true
          echo "==== collect ===="
          mkdir -p "${RELEASE_DIR}"
          cp "${IMG}" "${RELEASE_DIR}/Image"
          find "${OUT_DIR}" -name 'goodix_3626.ko' -exec cp {} "${RELEASE_DIR}/goodix_3626.ko" \; 2>/dev/null || true
          ls -lh "${RELEASE_DIR}/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marble-kernel-ksu
          path: ${{ env.KERNEL_DIR }}/${{ env.RELEASE_DIR }}/*
          if-no-files-found: error
